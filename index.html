<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conexão Bravo - Costa Verde</title>
    <meta name="description" content="Sistema de gestão e troca de escala de serviço para militares do 10º GBM - Angra dos Reis. Permite visualizar a escala anual e solicitar trocas respeitando os prazos legais." />
    <meta property="og:title" content="Remix: 10º GBM - Sistema de Permutas" />
    <meta property="og:description" content="Sistema de gestão e troca de escala de serviço para militares do 10º GBM - Angra dos Reis. Permite visualizar a escala anual e solicitar trocas respeitando os prazos legais." />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('conexao_bravo_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
      window.addEventListener('error', function(event) {
        console.error('GLOBAL ERROR:', event.message, event.filename, event.lineno, event.colno, event.error);
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('UNHANDLED REJECTION:', event.reason?.message || event.reason);
        event.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
