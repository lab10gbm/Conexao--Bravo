name: Render Keep-Alive Robot (24/7 Ininterrupto)

# Robô para manter o serviço do Render 100% ativo 24 horas por dia, 7 dias por semana.
# Dispara a cada 12 minutos ininterruptamente para impedir que a instância entre em modo sleep.

on:
  schedule:
    # Dispara a cada 12 minutos, 24 horas por dia, todos os dias do ano
    - cron: '*/12 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL do App no Render (opcional se já tiver configurado em secrets/vars)'
        required: false
        default: ''

jobs:
  keep-alive:
    name: Ping Keep-Alive 24/7
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Executar Ping no Render
        run: |
          TARGET_URL="${{ inputs.target_url || secrets.RENDER_APP_URL || vars.RENDER_APP_URL || 'https://cbmerj-10gbm.onrender.com' }}"
          # Remove barra final se houver
          TARGET_URL="${TARGET_URL%/}"
          HEALTH_URL="${TARGET_URL}/api/health"
          
          echo "=================================================="
          echo "🤖 Iniciando Robô Keep-Alive Render (Modo 24/7)"
          echo "📅 Data/Hora UTC: $(date -u)"
          echo "🎯 Alvo: $HEALTH_URL"
          echo "=================================================="

          HTTP_CODE=$(curl -s -L -o /tmp/health_response.json -w "%{http_code}" \
            -H "User-Agent: GitHubActions-KeepAliveRobot/1.0 (24-7 Mode)" \
            -H "X-Keep-Alive: github-actions-24h" \
            --max-time 60 \
            "$HEALTH_URL" || echo "000")

          echo "Código HTTP retornado: $HTTP_CODE"
          
          if [ -f /tmp/health_response.json ]; then
            echo "Resposta recebida:"
            cat /tmp/health_response.json
            echo ""
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ SUCESSO: Site mantido acordado com sucesso no Render 24/7!"
          elif [ "$HTTP_CODE" -eq 000 ]; then
            echo "⚠️ AVISO: Timeout ou conexão não concluída. O servidor pode estar em processo de acordar (Cold Start)."
          else
            echo "ℹ️ INFO: Resposta com status $HTTP_CODE (Serviço recebeu o tráfego HTTP e zerou o timer de inatividade)."
          fi
